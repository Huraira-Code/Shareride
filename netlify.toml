[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"

# Ensure static assets in dist/assets are served directly with correct MIME types
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Serverless function fallback for SSR routes
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200